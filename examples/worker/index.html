<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random walks</title>
  <style>
    :root { color-scheme: light dark; font: 13px system-ui; } body { margin: 24px; }
    h1 { font-size: 19px; font-weight: 500; } canvas { width: 100%; background: light-dark(#f4f4f4,#292929); }
    label { display: inline-grid; gap: 5px; margin: 12px 12px 12px 0; } input { width: 100px; }
    button, input { font: inherit; padding: 6px; } output { display: block; margin: 12px 0; }
    details { margin-top: 18px; } details button { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Random walks</h1>
  <canvas width="600" height="360" aria-label="Mean squared displacement plot"></canvas>
  <label>Walkers<input id="walkers" type="number" min="1" max="10000" value="500"></label>
  <label>Steps<input id="steps" type="number" min="1" max="10000" value="200"></label>
  <label>Seed<input id="seed" type="number" value="7"></label>
  <div><button id="run" disabled>Run</button> <button id="reset">Reset</button></div>
  <output id="status" role="status">Starting worker…</output>
  <details><summary>Worker diagnostics</summary><button id="error">Throw worker error</button> <button id="runaway">Runaway worker</button></details>
  <script type="module" src="./walk.js"></script>
</body>
</html>
